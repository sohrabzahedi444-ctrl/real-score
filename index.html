<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Real Score — Post-Screening Rating</title>

<!-- ============================================================
     FONTS
     Fraunces  → characterful serif for the score numeral & title
                 (old-style figures give the number real presence)
     Manrope   → clean geometric sans for UI copy & labels
     ============================================================ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">

<style>
  /* =========================================================
     DESIGN TOKENS
     A small, deliberate palette: near-black cinema backdrop,
     a velvety crimson as the single accent. Everything else is
     restrained so the crimson (and the score) reads as the one
     thing that "lights up".
     ========================================================= */
  :root{
    --bg:            #000000;
    --bg-glow:        #000000;
    --surface:        #08090a;
    --surface-raised: #1a1e24;
    --line:           rgba(237,235,230,0.08);
    --line-strong:    rgba(237,235,230,0.14);

    --text:           #edebe6;
    --text-dim:       rgba(237,235,230,0.58);
    --text-faint:     rgba(237,235,230,0.34);

    --accent:         #a51c3f;
    --accent-soft:    rgba(165,28,63,0.18);
    --accent-strong:  #c93b5c;

    --radius-lg: 26px;
    --radius-md: 16px;
    --radius-sm: 10px;

    --ease: cubic-bezier(.22,1,.36,1);
  }

  /* Respect reduced-motion preference everywhere */
  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
      animation-duration: 0.001ms !important;
      animation-delay: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
      scroll-behavior: auto !important;
    }
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0;
    padding:0;
    min-height:100%;
    background: #000000;
  }

  body{
    background: var(--bg-glow);
    color: var(--text);
    font-family: 'Manrope', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 32px 16px 28px;
    min-height:100vh;
  }

  /* =========================================================
     PAGE FOOTER
     A permanent, global element — independent of content type,
     score, or language. Small, quiet, and always in the same
     spot at the very bottom of the page.
     ========================================================= */
  .app-footer{
    width:100%;
    max-width: 420px;
    margin-top: 26px;
    text-align:center;
    font-family:'Manrope', system-ui, sans-serif;
    font-size: 11px;
    font-weight:500;
    letter-spacing: 0.02em;
    color: var(--text-faint);
    white-space:nowrap;
  }

  /* =========================================================
     INTRO SEQUENCE
     A brief, one-time branded splash (~1.1s), then the app
     itself fades + scales in, followed by the five questions
     cascading in one after another. Pure CSS timeline — no
     layout thrash, only opacity/transform, so it stays smooth
     on mobile. Runs once per page load; switching content type
     or language afterward never replays it.
     ========================================================= */
  .intro-splash{
    position:fixed;
    inset:0;
    z-index:1000;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:8px;
    background: #000000;
    animation: introFade 1.1s ease-out forwards;
  }
  @keyframes introFade{
    0%   { opacity:1; }
    72%  { opacity:1; }
    100% { opacity:0; }
  }
  .intro-title{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size: 34px;
    letter-spacing:-0.01em;
    color: var(--text);
  }
  .intro-sub{
    font-family:'Manrope', system-ui, sans-serif;
    font-size: 11px;
    font-weight:700;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color: var(--accent);
  }

  /* Holds the type switcher above the card, both sharing one
     centered column so they line up and resize together. */
  .app-shell{
    width:100%;
    max-width: 420px;
    display:flex;
    flex-direction:column;
    align-items:stretch;
    gap:14px;
    animation: introCardReveal .5s var(--ease) 1.1s both;
  }
  @keyframes introCardReveal{
    0%   { opacity:0; transform: scale(0.985); }
    100% { opacity:1; transform: scale(1); }
  }

  /* =========================================================
     CONTENT-TYPE SWITCHER — MOVIE / SERIES / MINI SERIES
     A rounded pill track with a highlight that physically
     slides beneath the selected label. Same tokens, same
     radius language, same accent as the rest of the app.
     ========================================================= */
  .type-switcher{
    position:relative;
    display:flex;
    width:100%;
    background: var(--surface-raised);
    border: 1px solid var(--line-strong);
    border-radius: 999px;
    padding: 4px;
  }
  .type-highlight{
    position:absolute;
    top:4px;
    left:4px;
    height: calc(100% - 8px);
    width: calc((100% - 8px) / 3);
    background: linear-gradient(135deg, var(--accent-strong), var(--accent) 65%, #6e1029);
    border-radius: 999px;
    box-shadow: 0 4px 14px -5px rgba(165,28,63,0.6);
    transform: translateX(0%);
    transition: transform .4s var(--ease);
  }
  .type-btn{
    -webkit-tap-highlight-color: transparent;
    position:relative;
    z-index:1;
    flex:1;
    appearance:none;
    cursor:pointer;
    font-family:'Manrope', system-ui, sans-serif;
    border:none;
    background:transparent;
    color: rgba(237,235,230,0.26);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.02em;
    padding: 12px 8px 12px 4px;
    border-radius: 999px;
    white-space:nowrap;
    transition: color .3s var(--ease);
  }
  .type-btn:focus-visible{
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .type-btn.active{ color: #fbeef1; }

  /* =========================================================
     CARD — the whole app lives inside a single ticket-like card
     ========================================================= */
  .card{
    width:100%;
    max-width: 420px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    padding: 28px 22px 26px;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.03) inset,
      0 30px 60px -20px rgba(0,0,0,0.6);
    position: relative;
    overflow:hidden;
  }

  /* Faint perforated edge along the top of the card — a quiet
     nod to a film strip, purely textural, not another UI control */
  .card::before{
    content:"";
    position:absolute;
    top:0; left:0; right:0;
    height:10px;
    background-image: radial-gradient(circle, rgba(255,255,255,0.10) 1.6px, transparent 1.6px);
    background-size: 16px 10px;
    background-position: 8px 0;
    opacity:0.5;
  }

  /* =========================================================
     LANGUAGE TOGGLE — EN / FA
     Small pill switch, top-right of the card. Uses only the
     existing color tokens so it matches the rest of the app.
     ========================================================= */
  .lang-toggle{
    position:absolute;
    top:22px;
    right:22px;
    display:flex;
    gap:2px;
    padding:3px;
    background: var(--surface-raised);
    border:1px solid var(--line-strong);
    border-radius:999px;
  }
  .lang-btn{
    -webkit-tap-highlight-color: transparent;
    appearance:none;
    cursor:pointer;
    font-family:'Manrope', system-ui, sans-serif;
    border:none;
    background:transparent;
    color: var(--text-faint);
    font-size:10px;
    font-weight:800;
    letter-spacing:0.04em;
    padding:6px 10px;
    border-radius:999px;
    transition: background var(--ease) .25s, color var(--ease) .25s;
  }
  .lang-btn:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:2px;
  }
  .lang-btn.active{
    background: linear-gradient(135deg, var(--accent-strong), var(--accent) 65%, #6e1029);
    color:#fbeef1;
  }

  /* =========================================================
     HEADER
     ========================================================= */
  .eyebrow{
    display:block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 6px 0 6px;
  }

  h1{
    font-family:'Fraunces', serif;
    font-weight: 600;
    font-size: 30px;
    line-height:1.1;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }

  .subtitle{
    font-size: 12px;
    color: rgba(237,235,230,0.68);
    margin: 0 0 20px;
    line-height:1.5;
  }

  /* =========================================================
     TITLE FIELD — optional name of the thing being rated.
     A wide, rounded rectangle that reads as part of the card's
     own dark surface rather than a conventional form control:
     near-black interior, a thin crimson outline with a soft
     restrained glow (never neon).
     Purely cosmetic to the result text — never read by scoring.
     ========================================================= */
  .title-field-wrap{
    position:relative;
    margin: 0 0 20px;
  }
  .title-field{
    width:100%;
    appearance:none;
    background: #0b0c0e;
    border: 1px solid rgba(165,28,63,0.45);
    border-radius: 14px;
    box-shadow: 0 0 0 1px rgba(165,28,63,0.06), 0 0 16px -6px rgba(165,28,63,0.35);
    padding: 14px 16px;
    font-family:'Manrope', system-ui, sans-serif;
    font-size: 14px;
    font-weight:500;
    letter-spacing:0.01em;
    color: var(--text);
    transition: border-color .3s var(--ease), box-shadow .3s var(--ease);
  }
  .title-field::placeholder{
    color: var(--text-faint);
    font-weight:500;
  }
  .title-field:focus{
    outline:none;
    border-color: rgba(201,59,92,0.7);
    box-shadow: 0 0 0 1px rgba(201,59,92,0.12), 0 0 18px -5px rgba(201,59,92,0.45);
  }

  /* Live "yes" indicator strip — five dots, one per question.
     Each dot lights crimson the instant its question is answered
     "yes", giving quiet real-time feedback as you go. */
  .reel-strip{
    display:flex;
    gap:9px;
    margin-bottom: 22px;
  }
  .reel-dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background: var(--surface-raised);
    border:1px solid var(--line-strong);
    transition: background var(--ease) .25s, box-shadow var(--ease) .25s, transform var(--ease) .25s;
  }
  .reel-dot.lit{
    background: var(--accent);
    border-color: var(--accent);
    box-shadow: 0 0 10px 1px var(--accent-soft);
    transform: scale(1.05);
  }

  /* =========================================================
     QUESTIONS
     ========================================================= */
  /* Fades as a unit whenever the content type changes */
  .questions-wrap{
    transition: opacity .18s var(--ease);
  }

  .questions{
    display:flex;
    flex-direction:column;
    gap: 8px;
    margin-bottom: 22px;
  }

  /* One-time cascading reveal for the five question rows present
     at initial page load — fade + very slight scale, no sliding,
     each starting a touch after the previous. Only ever plays
     once: switching content type later just swaps text on these
     same elements, it doesn't recreate them. */
  .questions .question{
    animation: introQuestionReveal .35s var(--ease) both;
  }
  @keyframes introQuestionReveal{
    0%   { opacity:0; transform: scale(0.97); }
    100% { opacity:1; transform: scale(1); }
  }
  .questions .question:nth-child(1){ animation-delay: 1.6s; }
  .questions .question:nth-child(2){ animation-delay: 1.82s; }
  .questions .question:nth-child(3){ animation-delay: 2.04s; }
  .questions .question:nth-child(4){ animation-delay: 2.26s; }
  .questions .question:nth-child(5){ animation-delay: 2.48s; }

  /* Shown instead of .questions for a type with no question set
     yet (Mini Series) — same restrained styling as the rest of
     the app's quiet, secondary text. */
  .questions-placeholder{
    display:none;
    text-align:center;
    font-size: 13.5px;
    line-height:1.6;
    color: var(--text-dim);
    padding: 30px 10px;
    margin: 0 0 22px;
  }

  /* Each row is its own soft, rounded container. Transparent and
     flush by default; once answered it gains a thin accent-tinted
     border to mark the question as complete. */
  .question{
    display:flex;
    flex-direction: column;
    align-items:flex-start;
    gap:10px;
    padding: 12px 12px;
    border: 1px solid transparent;
    border-radius: var(--radius-sm);
    transition: border-color .4s var(--ease), background-color .4s var(--ease), box-shadow .3s var(--ease);
  }
  .question.answered{
    border-color: rgba(165,28,63,0.35);
    background: rgba(165,28,63,0.05);
  }
  /* Persian mode: the choice group sits at the right edge of the
     row. The actual slide is animated in JS (transform), this just
     sets the resting position the animation settles into. */
  .question.fa-align{
    align-items: flex-end;
  }

  .question-text{
    font-size: 13.5px;
    line-height:1.42;
    color: var(--text);
    font-weight: 500;
  }

  /* =========================================================
     THREE-OPTION CHOICE CONTROL — No / Partially / Yes
     Each question gets its own small group of three pill
     buttons. Picking one enlarges + highlights it in the accent
     color while the other two collapse away; tapping the chosen
     pill again re-opens the group so the answer can be changed.
     ========================================================= */
  .choice-group{
    display:flex;
    align-items:center;
    gap: 6px;
    flex-shrink:0;
  }

  .choice{
    -webkit-tap-highlight-color: transparent;
    appearance:none;
    cursor:pointer;
    font-family: inherit;
    border: 1px solid var(--line-strong);
    background: var(--surface-raised);
    color: var(--text-dim);
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.02em;
    padding: 7px 10px;
    margin:0;
    border-radius: 999px;
    white-space:nowrap;
    max-width: 90px;
    overflow:hidden;
    transition:
      transform .32s var(--ease),
      opacity .3s var(--ease),
      max-width .38s var(--ease),
      padding .38s var(--ease),
      border-color .25s var(--ease),
      background .25s var(--ease),
      color .25s var(--ease),
      box-shadow .25s var(--ease);
  }
  .choice:focus-visible{
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .choice:hover{ color: var(--text); border-color: var(--text-faint); }

  .choice.selected{
    background: linear-gradient(135deg, var(--accent-strong), var(--accent) 65%, #6e1029);
    color: #fbeef1;
    border-color: var(--accent);
    transform: scale(1.1);
    box-shadow: 0 4px 14px -5px rgba(165,28,63,0.6);
  }

  /* The two un-picked pills shrink to nothing and fade out */
  .choice.hidden-option{
    opacity: 0;
    max-width: 0;
    padding-left: 0;
    padding-right: 0;
    border-width: 0;
    transform: scale(0.8);
    pointer-events:none;
  }

  /* Subtle validation cue for a row still missing an answer.
     Deliberately uses `transition`, not `animation` — the
     question row's `animation` property is already spoken for
     by its one-time entrance reveal (introQuestionReveal), and a
     second `animation` rule here would silently replace that
     declaration and make it replay later. A transition sidesteps
     that entirely: it just eases the highlight in, then back out
     when the class is removed a moment later. */
  .question.needs-answer{
    border-color: rgba(165,28,63,0.55);
    background: rgba(165,28,63,0.06);
    box-shadow: 0 0 0 3px rgba(165,28,63,0.12);
  }
  /* The accompanying micro-shake lives on the answer control
     itself (the "answer area"), a separate element with no
     animation of its own to collide with. */
  @keyframes choiceShake{
    0%   { transform: translateX(0); }
    22%  { transform: translateX(-4px); }
    44%  { transform: translateX(4px); }
    66%  { transform: translateX(-2px); }
    85%  { transform: translateX(1px); }
    100% { transform: translateX(0); }
  }
  .question.needs-answer .choice-group{
    animation: choiceShake .45s var(--ease);
  }

  /* Quiet reminder shown when Calculate is pressed with gaps left */
  .incomplete-hint{
    text-align:center;
    font-size: 12px;
    color: var(--text-dim);
    opacity: 0;
    max-height: 0;
    overflow:hidden;
    margin: 0;
    transition: opacity .3s var(--ease), max-height .3s var(--ease), margin .3s var(--ease);
  }
  .incomplete-hint.visible{
    opacity: 1;
    max-height: 40px;
    margin: 12px 0 0;
  }

  /* =========================================================
     ACTIONS
     ========================================================= */
  .actions{
    display:flex;
    gap: 10px;
    margin-bottom: 6px;
  }

  button.action{
    -webkit-tap-highlight-color: transparent;
    border:none;
    cursor:pointer;
    font-family: inherit;
    border-radius: var(--radius-md);
    padding: 15px 18px;
    font-size: 14.5px;
    font-weight: 700;
    letter-spacing: 0.01em;
    transition: transform var(--ease) .15s, filter var(--ease) .15s, background var(--ease) .15s;
  }
  button.action:active{ transform: scale(0.97); }

  .btn-primary{
    flex: 2.1;
    color: #fbeef1;
    background: linear-gradient(135deg, var(--accent-strong), var(--accent) 60%, #6e1029);
    box-shadow: 0 8px 20px -8px rgba(165,28,63,0.55);
  }
  .btn-primary:hover{ filter: brightness(1.06); }
  .btn-primary:disabled{
    opacity:0.4;
    cursor:not-allowed;
    filter:none;
    box-shadow:none;
  }

  .btn-secondary{
    flex: 1;
    color: var(--text-dim);
    background: var(--surface-raised);
    border: 1px solid var(--line-strong);
  }
  .btn-secondary:hover{ color: var(--text); border-color: var(--text-faint); }

  /* =========================================================
     RESULT PANEL
     ========================================================= */
  .result{
    margin-top: 4px;
    max-height: 0;
    opacity: 0;
    overflow: hidden;
    transition: max-height .5s var(--ease), opacity .4s var(--ease), margin-top .5s var(--ease);
  }
  .result.visible{
    max-height: 320px;
    opacity: 1;
    margin-top: 22px;
  }

  .result-inner{
    text-align:center;
    padding-top: 22px;
    border-top: 1px solid var(--line);
  }

  .result-score-wrap{
    position:relative;
    display:inline-flex;
    align-items:baseline;
    justify-content:center;
    gap:4px;
  }

  .result-score{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size: 76px;
    line-height:1;
    letter-spacing:-0.02em;
    background: linear-gradient(180deg, var(--accent-strong), var(--accent) 70%);
    -webkit-background-clip:text;
    background-clip:text;
    color: transparent;
    text-shadow: 0 0 40px var(--accent-soft);
  }
  .result-max{
    font-size: 20px;
    font-weight:700;
    color: var(--text-faint);
  }

  /* =========================================================
     SCORE-RESULT LIVE ANIMATION SYSTEM (rebuilt from scratch)
     One shared entrance ("scoreSettle") plus a per-tier living
     atmosphere built from real vector shapes (see the <svg>
     sprite sheet just inside <body>: cloud, meteor+tail, petal,
     raindrop, branching crack, star) rather than CSS blobs.
     Every fx group defaults to display:none and is switched on
     only by its tier's class on .result-score-wrap, so inactive
     tiers cost nothing to paint. All loops are gated purely by
     that tier-N class — added by Calculate, cleared by Reset or
     by leaving the result state — no JS timers involved.
     ========================================================= */

  .result-score-wrap{
    position:relative;
    isolation:isolate; /* keeps fx z-index local to this box */
  }
  .result-score{
    position:relative;
    z-index:2; /* always painted above every fx layer below */
    animation: scoreSettle .8s var(--ease) both;
  }
  @keyframes scoreSettle{
    0%   { opacity:0; transform: translateY(6px) scale(0.94); filter: brightness(var(--tb0,0.92)); }
    42%  { opacity:1; transform: translateX(var(--tshake,0px)) scale(1.03); filter: brightness(var(--tb1,1.04)); }
    60%  { transform: translateX(calc(var(--tshake,0px) * -0.55)) scale(1); }
    78%  { transform: translateX(calc(var(--tshake,0px) * 0.25)); }
    100% { opacity:1; transform: translateX(0) scale(1); filter: brightness(var(--tb2,1)); }
  }

  /* Per-tier entrance intensity. 10→brightest, 0→dimmest. */
  .result-score-wrap.tier-10{ --tb0:0.94; --tb1:1.1;  --tb2:1.04; --tshake:0px; }
  .result-score-wrap.tier-9 { --tb0:0.94; --tb1:1.08; --tb2:1.02; --tshake:0px; }
  .result-score-wrap.tier-8 { --tb0:0.95; --tb1:1.05; --tb2:1.01; --tshake:0px; }
  .result-score-wrap.tier-7 { --tb0:0.96; --tb1:1.04; --tb2:1;    --tshake:0px; }
  .result-score-wrap.tier-6 { --tb0:0.97; --tb1:1.02; --tb2:1;    --tshake:0px; }
  .result-score-wrap.tier-5 { --tb0:1;    --tb1:1;    --tb2:0.95; --tshake:0px; }
  .result-score-wrap.tier-4 { --tb0:0.92; --tb1:0.98; --tb2:0.93; --tshake:0px; }
  .result-score-wrap.tier-3 { --tb0:0.92; --tb1:0.97; --tb2:0.94; --tshake:0px; }
  .result-score-wrap.tier-2 { --tb0:0.86; --tb1:0.94; --tb2:0.88; --tshake:2px; }
  .result-score-wrap.tier-1 { --tb0:0.8;  --tb1:0.9;  --tb2:0.83; --tshake:2.5px; }
  .result-score-wrap.tier-0 { --tb0:0.72; --tb1:0.86; --tb2:0.76; --tshake:3.5px; }

  /* Shared fx-group defaults: absolutely positioned, generous
     overflow room around the number, invisible unless a tier
     switches them on, and never intercepting taps. */
  .fx-clouds, .fx-meteors, .fx-orbit, .fx-stars,
  .fx-blossoms, .fx-rain, .fx-cracks{
    position:absolute;
    inset: -64px -56px;
    z-index:1;
    pointer-events:none;
    display:none;
  }

  /* ---------------------------------------------------------
     10 / 9 — METALLIC TYPOGRAPHY SWEEP
     No overlay element at all: the shine is a second gradient
     layer baked directly into .result-score's own text-clipped
     background, so it is physically impossible for it to render
     outside the glyphs. A slow, mostly-idle cycle (the highlight
     sits parked off-canvas most of the time) so it reads as an
     occasional catch of light, not a constant scroll.
     ========================================================= */
  .result-score-wrap.tier-10 .result-score,
  .result-score-wrap.tier-9 .result-score{
    background-repeat: no-repeat;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: none;
  }
  .result-score-wrap.tier-10 .result-score{
    background-image:
      linear-gradient(115deg, transparent 42%, rgba(255,255,255,0.95) 50%, transparent 58%),
      linear-gradient(160deg, #fbdfe6 0%, var(--accent-strong) 38%, var(--accent) 68%, #7a1330 100%);
    background-size: 300% 100%, 100% 100%;
    background-position: -180% 0, 0 0;
    animation: scoreSettle .8s var(--ease) both, metallicSweep10 8.5s cubic-bezier(.45,0,.15,1) infinite 1.2s;
  }
  .result-score-wrap.tier-9 .result-score{
    background-image:
      linear-gradient(115deg, transparent 44%, rgba(255,255,255,0.75) 50%, transparent 56%),
      linear-gradient(160deg, #f6d7de 0%, var(--accent-strong) 42%, var(--accent) 72%, #6e1029 100%);
    background-size: 300% 100%, 100% 100%;
    background-position: -180% 0, 0 0;
    animation: scoreSettle .8s var(--ease) both, metallicSweep9 10s cubic-bezier(.45,0,.15,1) infinite 1.4s;
  }
  /* Slow, luxurious traverse (~2.9s of an 8.5s cycle) with a
     gentle brightness rise timed to the light passing over the
     glyphs, then a long natural pause before it repeats. */
  @keyframes metallicSweep10{
    0%   { background-position: -180% 0, 0 0; filter: brightness(1); }
    15%  { filter: brightness(1.22); }
    34%  { background-position: 180% 0, 0 0; filter: brightness(1); }
    100% { background-position: 180% 0, 0 0; filter: brightness(1); }
  }
  @keyframes metallicSweep9{
    0%   { background-position: -180% 0, 0 0; filter: brightness(1); }
    16%  { filter: brightness(1.13); }
    30%  { background-position: 180% 0, 0 0; filter: brightness(1); }
    100% { background-position: 180% 0, 0 0; filter: brightness(1); }
  }

  /* ---------------------------------------------------------
     8 — GALACTIC MICRO-SPARKLE
     Real 4-point star glyphs (not dots), each with its own
     size/position/timing via inline custom properties. Most
     twinkle fully in and out; a couple stay stably visible with
     only a gentle shimmer, the way real stars don't all pulse
     the same way in a night sky.
     ========================================================= */
  .result-score-wrap.tier-8 .fx-stars{ display:block; }
  .fx-stars .fx-star{
    position:absolute;
    top:50%; left:50%;
    width: var(--sz, 6px);
    height: var(--sz, 6px);
    color: var(--sc, #f3e6ec);
    fill: currentColor;
    opacity:0;
    filter: drop-shadow(0 0 2px currentColor);
    transform: translate(calc(-50% + var(--sx,0)), calc(-50% + var(--sy,0))) scale(0.4) rotate(var(--srot,0deg));
    animation: starTwinkle var(--sdur,2.4s) ease-in-out infinite var(--sdelay,0s);
  }
  @keyframes starTwinkle{
    0%, 100% { opacity:0; transform: translate(calc(-50% + var(--sx,0)), calc(-50% + var(--sy,0))) scale(0.35) rotate(var(--srot,0deg)); }
    45%      { opacity:0.95; }
    50%      { transform: translate(calc(-50% + var(--sx,0)), calc(-50% + var(--sy,0))) scale(1) rotate(var(--srot,0deg)); }
  }
  /* Stable stars: never fully disappear, just breathe gently */
  .fx-stars .fx-star.is-stable{
    animation-name: starShimmer;
  }
  @keyframes starShimmer{
    0%, 100% { opacity:0.55; transform: translate(calc(-50% + var(--sx,0)), calc(-50% + var(--sy,0))) scale(0.85) rotate(var(--srot,0deg)); }
    50%      { opacity:0.85; transform: translate(calc(-50% + var(--sx,0)), calc(-50% + var(--sy,0))) scale(1) rotate(var(--srot,0deg)); }
  }

  /* ---------------------------------------------------------
     7 — METEOR SHOWER + ORBITING HERO COMET
     Each ambient meteor is one SVG containing a tapered wedge
     tail, a bright core, and a white heated hot-spot at the very
     front. Their flight now bows gently off a straight line (a
     lightweight curved-trajectory approximation) and picks up a
     touch of motion blur at full speed. The orbit element is
     upgraded from a plain dot into a full comet: it inherits the
     rotating wrapper's spin, so its tail automatically trails
     the correct direction throughout the whole orbit with no
     extra math — a fixed local rotation just points its nose
     tangentially instead of radially.
     ========================================================= */
  .result-score-wrap.tier-7 .fx-meteors,
  .result-score-wrap.tier-7 .fx-orbit{ display:block; }
  .fx-meteors .fx-meteor{
    position:absolute;
    top: var(--my, 20%);
    left: -18%;
    width: var(--mw, 46px);
    height: calc(var(--mw, 46px) * 0.14);
    color: var(--mc, #eef0ff);
    fill: currentColor;
    opacity:0;
    transform: rotate(var(--mrot,18deg)) translate(0,0) scaleX(0.5);
    animation: meteorFly var(--mdur,6.5s) cubic-bezier(.3,.05,.2,1) infinite var(--mdelay,0s);
  }
  @keyframes meteorFly{
    0%   { opacity:0;   filter: drop-shadow(0 0 2px currentColor) blur(0px);   transform: rotate(var(--mrot,18deg)) translate(0,0) scaleX(0.4); }
    6%   { opacity:1;   filter: drop-shadow(0 0 3px currentColor) blur(0px);   transform: rotate(var(--mrot,18deg)) translate(6%,-2px) scaleX(1); }
    40%  { opacity:1;   filter: drop-shadow(0 0 4px currentColor) blur(.35px); transform: rotate(var(--mrot,18deg)) translate(110%,6px) scaleX(1); }
    62%  { opacity:0.9; filter: drop-shadow(0 0 3px currentColor) blur(.15px); transform: rotate(var(--mrot,18deg)) translate(170%,3px) scaleX(1); }
    78%  { opacity:0;   filter: drop-shadow(0 0 2px currentColor) blur(0px);   transform: rotate(var(--mrot,18deg)) translate(230%,0) scaleX(1); }
    100% { opacity:0;   filter: drop-shadow(0 0 2px currentColor) blur(0px);   transform: rotate(var(--mrot,18deg)) translate(230%,0) scaleX(1); }
  }
  .fx-orbit{
    animation: orbitSpin 7s linear infinite;
  }
  .fx-orbit .fx-hero-comet{
    position:absolute;
    top:50%; left:50%;
    width:32px;
    height:4.7px;
    color:#e6d3ff;
    fill:currentColor;
    transform: translate(-50%,-50%) translateX(44px) rotate(90deg);
    animation: heroCometPulse 3.6s ease-in-out infinite;
  }
  @keyframes orbitSpin{ from{ transform: rotate(0deg); } to{ transform: rotate(360deg); } }
  @keyframes heroCometPulse{
    0%, 100% { transform: translate(-50%,-50%) translateX(44px) rotate(88deg); filter: drop-shadow(0 0 3px currentColor); opacity:0.92; }
    50%      { transform: translate(-50%,-50%) translateX(44px) rotate(94deg); filter: drop-shadow(0 0 6px currentColor); opacity:1; }
  }

  /* ---------------------------------------------------------
     6 — CHERRY BLOSSOM PETALS
     Real petal-silhouette SVGs drifting on individually varied
     paths (sideways drift + gentle rotation + slight vertical
     bob), each with its own depth cue via size/blur/opacity.
     ========================================================= */
  .result-score-wrap.tier-6 .fx-blossoms{ display:block; }
  .fx-blossoms .fx-petal{
    position:absolute;
    top:50%; left:50%;
    width: var(--pw, 12px);
    height: calc(var(--pw, 12px) * 1.3);
    color: var(--pc, #f3c7d3);
    fill: currentColor;
    opacity:0;
    filter: blur(var(--pblur,0px));
    transform: translate(calc(-50% + var(--px0,0)), calc(-50% + var(--py0,0))) rotate(0deg) scale(0.6);
    animation: petalDrift var(--pdur,5.5s) ease-in-out infinite var(--pdelay,0s);
  }
  @keyframes petalDrift{
    0%   { opacity:0; transform: translate(calc(-50% + var(--px0,0)), calc(-50% + var(--py0,0))) rotate(0deg) scale(0.6); }
    14%  { opacity:0.9; }
    50%  { transform: translate(calc(-50% + var(--px1,0)), calc(-50% + var(--py1,0))) rotate(var(--prot,140deg)) scale(1); }
    86%  { opacity:0.75; }
    100% { opacity:0; transform: translate(calc(-50% + var(--px2,0)), calc(-50% + var(--py2,0))) rotate(var(--prot2,260deg)) scale(0.85); }
  }

  /* ---------------------------------------------------------
     5 / 4 / 3 / 2 — CLOUD LAYER (shared)
     Real multi-lobe cloud silhouettes drifting slowly at
     different speeds/opacities/blur for depth. Reused as the
     base atmosphere for four tiers; only speed/density differ.
     ========================================================= */
  .result-score-wrap.tier-5 .fx-clouds,
  .result-score-wrap.tier-4 .fx-clouds,
  .result-score-wrap.tier-3 .fx-clouds,
  .result-score-wrap.tier-2 .fx-clouds{ display:block; }
  .fx-clouds .fx-cloud{
    position:absolute;
    top: var(--cy, 30%);
    left: 50%;
    width: var(--cw, 46px);
    height: auto;
    color: var(--cc, rgba(224,220,230,0.5));
    fill: currentColor;
    opacity: var(--co, 0.5);
    filter: blur(var(--cblur, 0.4px));
    transform: translate(-50%,-50%) translateX(var(--cx0,-70px));
    animation: cloudDrift var(--cdur,16s) linear infinite var(--cdelay,0s);
  }
  @keyframes cloudDrift{
    0%   { transform: translate(-50%,-50%) translateX(var(--cx0,-70px)); }
    100% { transform: translate(-50%,-50%) translateX(var(--cx1,70px)); }
  }
  /* 2/10 clouds move faster, matching the storm below */
  .result-score-wrap.tier-2 .fx-cloud{ animation-duration: calc(var(--cdur,16s) * 0.55); }

  /* 5/10 dims the number slightly to feel "overcast", per spec */
  .result-score-wrap.tier-5 .result-score{ filter: brightness(0.95); }

  /* 4/10 reuses the same cloud system but darker and more brooding */
  .result-score-wrap.tier-4 .fx-cloud{ filter: brightness(0.68) blur(var(--cblur, 0.4px)); }

  /* ---------------------------------------------------------
     4 — CLOUDS + FRACTURED SCORE
     Cracks appear once and settle at a low resting opacity
     (they must "remain visible after appearing", not loop).
     ========================================================= */
  .result-score-wrap.tier-4 .fx-cracks{ display:block; }
  .result-score-wrap.tier-4 .fx-crack:nth-child(-n+3){
    animation: crackAppear .9s ease-out var(--kdelay,0s) both;
    --krest: 0.3;
  }

  /* ---------------------------------------------------------
     3 / 2 — RAIN + SPLASH
     Real teardrop SVGs that visibly detach from the cloud band
     above (they start near the clouds' vertical position, not
     off-canvas) and fall continuously across depth layers, with
     small ring-splash marks pulsing at a fixed baseline. 2/10
     reuses the same system at higher density/speed with a wind
     skew and a soft, natural sway on the whole score wrapper
     (kept off the number itself so it never fights the
     entrance/sweep animations).
     ========================================================= */
  .result-score-wrap.tier-3 .fx-rain,
  .result-score-wrap.tier-2 .fx-rain{ display:block; }
  .fx-rain .fx-drop{
    position:absolute;
    top: 18%; /* originates at the cloud band above, not off-canvas */
    left: var(--rx, 50%);
    width: var(--rw, 5px);
    height: auto;
    color: var(--rc, rgba(214,224,240,0.55));
    fill: currentColor;
    opacity:0;
    transform: translateY(-6px) skewX(var(--rskew,0deg));
    animation: rainFall var(--rdur,1.6s) linear infinite var(--rdelay,0s);
  }
  @keyframes rainFall{
    0%   { opacity:0;              transform: translateY(-6px)  skewX(var(--rskew,0deg)); }
    10%  { opacity: var(--ro,0.8); transform: translateY(6px)   skewX(var(--rskew,0deg)); }
    85%  { opacity: var(--ro,0.8); }
    100% { opacity:0;              transform: translateY(134px) skewX(var(--rskew,0deg)); }
  }
  .fx-rain .fx-splash{
    position:absolute;
    bottom:6%;
    left: var(--sx, 50%);
    width:9px; height:9px;
    margin:-4.5px;
    border-radius:50%;
    border: 1.4px solid rgba(214,224,240,0.55);
    opacity:0;
    animation: splashRing var(--rdur,1.6s) linear infinite var(--rdelay,0s);
  }
  @keyframes splashRing{
    0%, 78%  { opacity:0; transform: scale(0.3) scaleY(1); }
    83%      { opacity:0.8; transform: scale(0.45) scaleY(0.6); }
    100%     { opacity:0; transform: scale(1.3) scaleY(1); }
  }
  /* 2/10: denser, faster, wind-driven, plus a soft natural sway
     (irregular timing/amplitude so it reads as weather, not a
     mechanical vibration) */
  .result-score-wrap.tier-2 .fx-drop{
    animation-duration: calc(var(--rdur,1.6s) * 0.62);
    --rskew: -13deg;
  }
  .result-score-wrap.tier-2{
    animation: stormSway 3.4s ease-in-out infinite;
  }
  @keyframes stormSway{
    0%, 100% { transform: translateX(0) rotate(0deg); }
    18%  { transform: translateX(-0.7px) rotate(-0.15deg); }
    38%  { transform: translateX(0.6px) rotate(0.1deg); }
    55%  { transform: translateX(-0.5px); }
    73%  { transform: translateX(0.4px) rotate(-0.1deg); }
    90%  { transform: translateX(-0.25px); }
  }

  /* ---------------------------------------------------------
     1 / 0 — CRACKED-EARTH BREAKDOWN
     Same branching-crack shape as tier 4, but denser and larger,
     directly across the number and extending subtly outward.
     Settles permanently visible once it appears (no looping).
     0/10 gets the strongest, dimmest treatment of all.
     ========================================================= */
  .result-score-wrap.tier-1 .fx-cracks,
  .result-score-wrap.tier-0 .fx-cracks{ display:block; }
  .result-score-wrap.tier-1 .fx-crack,
  .result-score-wrap.tier-0 .fx-crack{
    animation: crackAppear .9s ease-out var(--kdelay,0s) both;
  }
  .result-score-wrap.tier-1 .fx-crack{ --krest: 0.55; }
  .result-score-wrap.tier-0 .fx-crack{ --krest: 0.7; }
